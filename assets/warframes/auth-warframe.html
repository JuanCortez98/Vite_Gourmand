<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Warframe - Connexion / Inscription</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:0} .auth{max-width:420px;margin:3rem auto;padding:1rem;border:1px solid #eee;border-radius:8px}</style>
</head>
<body>
  <main class="auth">
    <h1>Connexion</h1>
    <form>
      <label>Email<input type="email" style="width:100%"></label>
      <label>Mot de passe<input type="password" style="width:100%"></label>
      <button type="submit">Se connecter</button>
    </form>
    <hr>
    <h2>Inscription</h2>
    <form>
      <label>Email<input type="email" style="width:100%"></label>
      <label>Mot de passe<input type="password" style="width:100%"></label>
      <label>Confirmer<input type="password" style="width:100%"></label>
      <button type="submit">S'inscrire</button>
    </form>
  </main>
</body>
</html>
